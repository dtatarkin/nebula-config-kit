# The check set is derived from what this repository holds: the baseline every
# repository runs, Python (pyproject.toml and src/) and markup (YAML, TOML,
# markdown). It carries no shell script, no infrastructure file, no web package
# and no data project, so none of those sets is here. The nixfmt hook is inert:
# there is no nix file for it to format.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: "0.13.5"
    hooks:
      - id: uv-lock

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "v0.27"
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.3.0
    hooks:
      - id: rumdl-check
        args: [--fix]

  - repo: local
    hooks:
      - id: format-justfile
        name: format justfile
        entry: bash -c 'for f in "$@"; do uv run just --fmt --unstable --justfile "$f"; done' --
        language: system
        files: (^|/)justfile$|\.just$

      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        files: \.nix$

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      # Path arguments rather than the repository root: the root also holds
      # lib/pki-kit, a vendored repository with its own checks.
      - id: ty
        name: ty
        entry: uv run ty check src tests
        language: system
        types: [python]
        pass_filenames: false

      # Manual stage only: the audit reads an advisory database over the
      # network, and a commit never waits on a remote service. Run it with
      # `just pre-commit run --hook-stage manual pip-audit`.
      - id: pip-audit
        name: pip-audit
        entry: >-
          bash -c 'uv export --no-hashes --no-emit-workspace --no-dev --quiet
          | uvx --quiet pip-audit --requirement /dev/stdin --disable-pip --no-deps --strict'
        language: system
        stages: [manual]
        always_run: true
        pass_filenames: false
