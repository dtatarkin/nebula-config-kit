[project]
name = "nebula-config-kit"
version = "0.0.1"
description = "Define your Nebula mesh network once, generate validated configs for every host"
readme = "README.md"
authors = [{ name = "Dmitry Tatarkin", email = "tatarkin@gmail.com" }]
license = "MIT"
requires-python = ">=3.12"
keywords = [
  "nebula",
  "vpn",
  "mesh-network",
  "overlay-network",
  "network-automation",
  "configuration-management",
  "infrastructure",
  "pki",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
  "Topic :: Security",
  "Typing :: Typed",
  "Environment :: Console",
  "Framework :: Pydantic :: 2",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["pki-kit>=0.0.2", "pydantic>=2.0", "ruamel-yaml>=0.18"]

[project.urls]
Homepage = "https://github.com/dtatarkin/nebula-config-kit"
Repository = "https://github.com/dtatarkin/nebula-config-kit"
Issues = "https://github.com/dtatarkin/nebula-config-kit/issues"
Changelog = "https://github.com/dtatarkin/nebula-config-kit/releases"

[tool.uv]
# The lockfile resolves under the hook pins' seven-day cooldown: a release less
# than a week old is where a broken or compromised upload is still live.
exclude-newer = "7 days"

[tool.uv.sources]
#pki-kit = { path = "lib/pki-kit", editable = true }

[project.optional-dependencies]
cli = ["typer>=0.15", "rich>=13.0"]

[project.scripts]
nebula-config = "nebula_config_kit.cli:main"
[dependency-groups]
dev = [
  "mypy",
  # The type checkers run through this lockfile, so the environment they see
  # has to hold what the CLI imports: the extra, by self-reference.
  "nebula-config-kit[cli]",
  "pre-commit",
  "pytest",
  "python-dotenv[cli]",
  "ruff",
  # The justfile formatter the commit hook runs. Pinned here rather than in
  # the hook entry, so the lockfile is where its version is visible.
  "rust-just",
  "ty>=0.0.24",
]

[tool.uv.build-backend]
module-name = "nebula_config_kit"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "I",
  "N",
  "UP",
  "B",
  "A",
  "C4",
  "DTZ",
  "T20",
  "SIM",
  "TCH",
  "RUF",
  "PT",
  "S",
  "ANN",
]
# Calling a subprocess, and calling one by name rather than by absolute path:
# tools are resolved by name here as a standing contract, so these two would
# fire on correct code every time.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# Tests are made of fixtures named password, secret and token: the credential
# rules match the name, never the value.
"tests/**" = ["S101", "S105", "S106", "S107", "ANN"]
"src/nebula_config_kit/cli/**/*.py" = ["T20", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["nebula_config_kit"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
# Names what is checked, so a vendored repository under lib/ never joins the run.
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "nebula_config_kit.cli.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "ruamel.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.rules]
unused-type-ignore-comment = "ignore"
unresolved-import = "ignore"
